<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>殷神飞机赛</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="game-panel">
      <header class="top-bar">
        <h1>殷神飞机赛</h1>
        <div class="score-box">分数：<span id="score">0</span></div>
      </header>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="480" height="640" aria-label="殷神飞机赛画布"></canvas>
        <div id="feedback" class="feedback hidden">太强了！</div>

        <div id="gameOverPanel" class="overlay hidden">
          <h2>游戏结束</h2>
          <p>最终分数：<span id="finalScore">0</span></p>
          <button id="restartBtn" type="button">重新开始</button>
        </div>
      </div>

      <p class="tips">← → 控制移动，空格键射击</p>
    </section>
  </main>
</body>
</html>
