<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>殷神飞机赛</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="game-panel">
      <header class="top-bar">
        <h1>殷神飞机赛</h1>
        <div class="top-actions">
          <div class="score-box">分数：<span id="score">0</span></div>
          <div class="stat-box">生命：<span id="lives">2</span></div>
          <div class="stat-box">最高：<span id="bestScore">0</span></div>
          <button id="pauseBtn" class="control-btn" type="button" disabled>暂停</button>
          <button id="musicBtn" class="music-btn" type="button" aria-pressed="true">暂停音乐</button>
        </div>
      </header>

      <audio id="bgm" src="bgm.mp3" loop autoplay preload="auto"></audio>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="480" height="640" aria-label="殷神飞机赛画布"></canvas>
        <div id="feedback" class="feedback hidden">太强了！</div>
        <div id="debugPanel" class="debug-panel hidden"></div>

        <div id="startPanel" class="overlay">
          <h2>殷神飞机赛</h2>
          <p>最高分：<span id="startBestScore">0</span></p>
          <button id="startBtn" type="button">开始游戏</button>
        </div>

        <div id="pausePanel" class="overlay hidden">
          <h2>已暂停</h2>
          <button id="resumeBtn" type="button">继续</button>
        </div>

        <div id="gameOverPanel" class="overlay hidden">
          <h2>游戏结束</h2>
          <p>最终分数：<span id="finalScore">0</span></p>
          <p>历史最高：<span id="finalBestScore">0</span></p>
          <button id="restartBtn" type="button">重新开始</button>
        </div>
      </div>

      <div class="status-row">
        <span>道具：<strong id="powerupStatus">无</strong></span>
        <span>阶段：<strong id="stageLabel">热身</strong></span>
      </div>
      <p class="tips">自动射击；电脑用 ← → 移动，手机滑动屏幕控制飞机</p>
    </section>
  </main>
</body>
</html>
